<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta name="description" content="" />
<meta name="author" content="" />
<title>MMS - 관리자</title>
<link href="/css/admin/styles.css" rel="stylesheet" />
<link href="/css/admin/faq.css" rel="stylesheet" />
<script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"
	crossorigin="anonymous"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
	crossorigin="anonymous"></script>
<script src="/js/admin/datatables-simple-demo.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Moment.js -->
<script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
<!-- Date Range Picker CSS -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
<!-- ck 에디터 -->
<script
	src="https://cdn.ckeditor.com/ckeditor5/39.0.0/classic/ckeditor.js"></script>
<!-- Date Range Picker JavaScript -->
<script
	src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
<script src="/js/admin/scripts.js"></script>
<script src="/js/admin/noticeForm.js"></script>
</head>
<body class="sb-nav-fixed">
	<!-- 네비게이션바 -->
	<nav th:replace="~{admin/navbar :: adminNavbarFragment}"></nav>
	<div id="layoutSidenav">
		<div id="layoutSidenav_nav">
			<!-- 사이드 네비게이션바 -->
			<nav th:replace="~{admin/sideNavbar :: adminSideNavbarFragment}"></nav>
		</div>
		<div id="layoutSidenav_content">
			<main>
				<div class="container-fluid px-4">
					<!-- title -->
					<!-- 			 		<div class="d-flex flex-column">
						<div>
							<h2 class="mt-4 mb-2">공지사항 등록</h2>
						</div>
					</div>  -->
					<!-- content -->
					<section class="py-4">
						<div class="container px-5 mb-5">
							<div class="row gx-1 justify-content-center">
								<div class="d-flex justify-content-center">
									<div class="col-lg-12 col-xl-9 col-xxl-8">
										<div class="card border-0 rounded-2 mb-2">
											<div class="card-body">
												<h2 class="card-title mb-4 fw-bold text-center">공지사항 등록</h2>
												<!-- 게시글 작성 Form -->
												<form id="saveForm">
													<input type="hidden" id="noticeId" name="id"
														th:value="${notice?.id}">
													<!-- 제목 입력 필드 -->
													<div class="mb-3">
														<label for="postTitle" class="form-label fw-bold">제목</label>
														<input type="text" class="form-control" id="postTitle"
															placeholder="게시글 제목을 입력하세요" required name="title"
															th:value="${notice?.title}">
													</div>

													<!-- 상단 고정 설정 -->
													<div class="mb-3 d-flex align-items-center gap-2">
														<input type="checkbox" id="isPinned" name="isPinned"
															class="form-check-input" th:checked="${notice?.isPinned}">
														<label for="isPinned" class="form-check-label fw-bold">상단
															고정</label>

														<!-- 우선순위 입력 필드 -->
														<div id="priorityField" class="ms-3"
															th:style="${notice?.isPinned} ? 'display: block;' : 'display: none;'">
															<input type="number" id="pinPriority" name="priority"
																class="form-control" placeholder="우선순위 입력" min="1"
																th:value="${notice?.priority}">
														</div>
													</div>

													<!-- 내용 입력 필드 -->
													<div class="mb-4">
														<label for="postContent" class="form-label fw-bold">내용</label>
														<textarea id="ck-editor" class="form-control"
															th:text="${notice?.content}"></textarea>
													</div>

													<!-- 버튼 그룹 (등록, 취소) -->
													<div class="d-flex justify-content-center gap-2">
														<button type="button" class="btn btn-secondary"
															id="cancelBtn">취소</button>
														<button class="btn btn-primary" id="submitBtn">등록</button>
													</div>
												</form>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

					</section>
				</div>
			</main>

		</div>
	</div>

</body>
</html>
